name: Output Injection Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-injection:
    runs-on: ubuntu-latest
    steps:
      - name: Write injected output
        id: inject
        run: |
          # Test if newlines in values can inject new output variables
          echo "safe_value=hello" >> $GITHUB_OUTPUT
          
          # Simulate attacker-controlled input with newline
          ATTACKER_INPUT="innocent
injected_secret=CANARY_SECRET_LEAKED"
          echo "user_input=$ATTACKER_INPUT" >> $GITHUB_OUTPUT
          
          # Also test with heredoc delimiter injection
          ATTACKER_INPUT2="value<<EOF"
          echo "user_input2=$ATTACKER_INPUT2" >> $GITHUB_OUTPUT
          echo "injected_via_heredoc=CANARY2" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          cat $GITHUB_OUTPUT
          echo "---"
          echo "File contents (hex):"
          xxd $GITHUB_OUTPUT | head -20
          
      - name: Read outputs
        run: |
          echo "safe_value=${{ steps.inject.outputs.safe_value }}"
          echo "user_input=${{ steps.inject.outputs.user_input }}"
          echo "user_input2=${{ steps.inject.outputs.user_input2 }}"
          echo "injected_secret=${{ steps.inject.outputs.injected_secret }}"
          echo "injected_via_heredoc=${{ steps.inject.outputs.injected_via_heredoc }}"
