name: Self Reference Test
on:
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-dollar-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Report from dollar-slash
        uses: $/self-reporter
      - name: Report context
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "SHA: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Action ref: $GITHUB_ACTION_REF"
