name: Setup Python TOML Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-toml-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python from pyproject
        id: setup
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Check injected output
        run: |
          echo "injected-output=${{ steps.setup.outputs.injected-output }}"
          echo "python-version=${{ steps.setup.outputs.python-version }}"
