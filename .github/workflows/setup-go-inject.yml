name: Setup Go Injection Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-go-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go from version file
        id: setup
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Check injection
        run: |
          echo "go-version output=${{ steps.setup.outputs.go-version }}"
