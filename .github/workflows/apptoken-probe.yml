name: apptoken-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/search/issues?q=%22test%20value%20private%20child%20canary%201%22&per_page=10" > /tmp/s1.json || true
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/search/issues?q=%22test%20value%20private%20child%20canary%202%22&per_page=10" > /tmp/s2.json || true
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"query":"query { repository(owner:\"tooforg\", name:\"public-test-repo\") { issue(number:217) { number title subIssues(first:10){ totalCount nodes { number title repository { nameWithOwner } } } blockedBy(first:10){ totalCount nodes { number title repository { nameWithOwner } } } } } }"}' https://api.github.com/graphql > /tmp/g.json || true
          python3 - <<'PY' > /tmp/comment.json
          import json
          def load(p):
              try: return json.load(open(p))
              except Exception as e: return {"parse_error":str(e)}
          out={}
          for k,p in [("search_canary1","/tmp/s1.json"),("search_canary2","/tmp/s2.json"),("graphql","/tmp/g.json")]:
              d=load(p)
              if k.startswith("search"):
                  out[k]={"total":d.get("total_count"),"message":d.get("message"),"items":[{"n":i.get("number"),"t":i.get("title"),"r":i.get("repository_url","").split("/repos/")[-1]} for i in (d.get("items") or [])[:10]]}
              else:
                  out[k]=d
          print(json.dumps({"body":json.dumps(out)[:60000]}))
          PY
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/comment.json "https://api.github.com/repos/tooforg/public-test-repo/issues/217/comments"
